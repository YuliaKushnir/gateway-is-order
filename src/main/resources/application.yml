server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:keycloak}:${KEYCLOAK_PORT:8181}/realms/cloud-realm

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        register: true
        service-name: gateway-service

    gateway:
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:${USER_SERVICE_PORT:8082}
          predicates:
            - Path=/api/users/**

        - id: product-service-products
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:${PRODUCT_SERVICE_PORT:8081}
          predicates:
            - Path=/api/products/**
        - id: product-service-categories
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:${PRODUCT_SERVICE_PORT:8081}
          predicates:
            - Path=/api/categories/**
        - id: product-service-stocks
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:${PRODUCT_SERVICE_PORT:8081}
          predicates:
            - Path=/api/stocks/**
        - id: product-service-images
          uri: http://${PRODUCT_SERVICE_HOST:localhost}:${PRODUCT_SERVICE_PORT:8081}
          predicates:
            - Path=/api/images/**

        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8083}
          predicates:
            - Path=/api/orders/**

        - id: print-service-prices
          uri: http://${PRINT_SERVICE_HOST:localhost}:${PRINT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/print-prices/**
        - id: print-service-types
          uri: http://${PRINT_SERVICE_HOST:localhost}:${PRINT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/print-types/**

      httpclient:
        response-timeout: 120s

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health,info,gateway

